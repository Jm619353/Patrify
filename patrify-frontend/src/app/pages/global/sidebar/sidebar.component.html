<aside
  class="fixed inset-y-0 left-0 z-40 flex h-screen w-72 transform flex-col bg-slate-950 text-slate-300 transition-transform duration-300 lg:sticky lg:top-0 lg:z-auto lg:h-screen lg:translate-x-0"
  [class.-translate-x-full]="!open"
>
  <div class="flex items-center justify-between px-6 py-6">
    <a routerLink="/home" class="flex items-center gap-3" (click)="closeSidebar()">
      <img
        src="assets/imgs/Patrify-logo-gradient2.png"
        alt="Patrify"
        class="h-9 w-9 rounded-xl bg-white/5 object-contain p-1"
      />
      <div>
        <p class="text-lg font-bold tracking-tight text-white">Patrify</p>
        <p class="text-[11px] uppercase tracking-[0.18em] text-slate-500">Gestão patrimonial</p>
      </div>
    </a>

    <button
      type="button"
      class="rounded-lg p-2 text-slate-400 transition hover:bg-white/5 hover:text-white lg:hidden"
      (click)="closeSidebar()"
      aria-label="Fechar menu"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <nav class="flex-1 space-y-1 overflow-y-auto px-3">
    <p class="px-3 pb-2 pt-3 text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-600">
      Operação
    </p>

    <ng-container *ngFor="let item of navItems">
      <a
        *ngIf="!item.adminOnly || auth.currentUser?.role !== 'company'"
        [routerLink]="item.route"
        routerLinkActive="bg-white/10 text-white shadow-sm"
        [routerLinkActiveOptions]="{ exact: !!item.exact }"
        class="group flex items-center justify-between gap-2 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-400 transition hover:bg-white/5 hover:text-white"
        [class.opacity-60]="isLocked(item)"
        (click)="closeSidebar()"
      >
        <span class="flex items-center gap-3 truncate">
          <svg
            class="h-5 w-5 flex-shrink-0 text-slate-500 transition group-hover:text-brand-300"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
          </svg>
          <span class="truncate">{{ item.label }}</span>
        </span>

        <span
          *ngIf="isLocked(item)"
          class="inline-flex items-center gap-1 rounded-md border border-amber-400/30 bg-amber-500/15 px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wider text-amber-300"
          title="Recurso disponível em plano superior"
        >
          🔒 {{ item.planBadge }}
        </span>
      </a>
    </ng-container>
  </nav>

  <div class="border-t border-white/10 p-4">
    <div *ngIf="auth.user$ | async as user" class="rounded-2xl bg-white/5 p-3">
      <div class="flex items-center gap-3">
        <div
          class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-brand-500 to-accent-500 text-sm font-bold text-white"
        >
          {{ initials(user.name) }}
        </div>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-semibold text-white">{{ user.name }}</p>
          <p class="truncate text-xs text-slate-500">{{ user.email }}</p>
        </div>
      </div>

      <div class="mt-2.5 flex items-center justify-between rounded-xl bg-slate-900/90 px-2.5 py-1.5">
        <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">
          Assinatura
        </span>
        <span
          class="rounded-md px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider"
          [ngClass]="
            user.role === 'admin' || user.plan === 'enterprise'
              ? 'bg-emerald-500/20 text-emerald-300'
              : user.plan === 'pro'
              ? 'bg-brand-500/20 text-brand-300'
              : 'bg-slate-700 text-slate-300'
          "
        >
          {{ planLabel(user.plan, user.role) }}
        </span>
      </div>
    </div>

    <button
      type="button"
      class="mt-3 flex w-full items-center justify-center gap-2 rounded-xl border border-white/10 px-3 py-2.5 text-sm font-medium text-slate-400 transition hover:border-rose-400/40 hover:bg-rose-500/10 hover:text-rose-300"
      (click)="logout()"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"
        />
      </svg>
      Sair da conta
    </button>
  </div>
</aside>
