<div
  *ngIf="open"
  class="fixed inset-0 z-[60] flex items-center justify-center bg-slate-950/50 p-4 backdrop-blur-sm"
  (click)="cancelled.emit()"
>
  <div
    class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl"
    role="dialog"
    aria-modal="true"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-start gap-4">
      <div
        class="flex h-11 w-11 flex-shrink-0 items-center justify-center rounded-full"
        [ngClass]="danger ? 'bg-rose-100 text-rose-600' : 'bg-amber-100 text-amber-600'"
      >
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"
          />
        </svg>
      </div>
      <div class="min-w-0">
        <h3 class="text-lg font-semibold text-slate-900">{{ title }}</h3>
        <p class="mt-1 text-sm leading-relaxed text-slate-600">{{ message }}</p>
      </div>
    </div>

    <div class="mt-6 flex justify-end gap-3">
      <button type="button" class="btn btn-ghost" (click)="cancelled.emit()" [disabled]="busy">
        {{ cancelLabel }}
      </button>
      <button
        type="button"
        class="btn"
        [ngClass]="danger ? 'btn-danger' : 'btn-primary'"
        (click)="confirmed.emit()"
        [disabled]="busy"
      >
        <span *ngIf="busy" class="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>
        {{ confirmLabel }}
      </button>
    </div>
  </div>
</div>
