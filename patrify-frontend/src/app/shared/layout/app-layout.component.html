<div class="min-h-screen bg-slate-50 lg:flex">
  <app-sidebar [open]="sidebarOpen" (close)="sidebarOpen = false"></app-sidebar>

  <div
    *ngIf="sidebarOpen"
    class="fixed inset-0 z-30 bg-slate-950/50 backdrop-blur-sm lg:hidden"
    (click)="sidebarOpen = false"
  ></div>

  <div class="flex min-w-0 flex-1 flex-col">
    <app-header (menuToggle)="sidebarOpen = !sidebarOpen"></app-header>

    <main class="flex-1 px-4 py-6 sm:px-6 lg:px-8">
      <router-outlet></router-outlet>
    </main>

    <footer class="border-t border-slate-200 px-4 py-4 text-xs text-slate-400 sm:px-6 lg:px-8">
      <div class="flex flex-col items-center justify-between gap-2 sm:flex-row">
        <span>© {{ currentYear }} Patrify · Gestão patrimonial inteligente</span>
        <span>Feito para simplificar o controle dos seus ativos</span>
      </div>
    </footer>
  </div>
</div>
